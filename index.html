<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Still on Work — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1f1f1f;
      --accent: #e8ff5a;
      --accent-dim: rgba(232, 255, 90, 0.08);
      --text-primary: #f0f0f0;
      --text-secondary: #6b6b6b;
      --text-muted: #3a3a3a;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ── Noise Overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── Glow ── */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,255,90,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.6; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ── Wrapper ── */
    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--surface);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── Heading ── */
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    h1 span {
      color: var(--accent);
    }

    /* ── Subtext ── */
    .subtext {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 400px;
    }

    /* ── Progress ── */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #fff9a0);
      border-radius: 999px;
      transition: width 2.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    /* ── Info Row ── */
    .info-row {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .info-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Notify Form ── */
    .notify-form {
      width: 100%;
      display: flex;
      gap: 0.5rem;
    }

    .notify-form input {
      flex: 1;
      padding: 0.7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .notify-form input::placeholder {
      color: var(--text-muted);
    }

    .notify-form input:focus {
      border-color: var(--accent);
    }

    .notify-form button {
      padding: 0.7rem 1.3rem;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }

    .notify-form button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .notify-form button:active {
      transform: translateY(0);
    }

    /* ── Success Message ── */
    .success-msg {
      display: none;
      font-size: 0.82rem;
      color: var(--accent);
      letter-spacing: 0.03em;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      z-index: 1;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .notify-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="wrapper">

    <!-- Badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      Still on Work
    </div>

    <!-- Heading -->
    <h1>Something<br /><span>great</span> is<br />coming.</h1>

    <!-- Subtext -->
    <p class="subtext">
      Kami sedang membangun sesuatu yang luar biasa.<br />
      Pantau terus — tidak akan lama lagi.
    </p>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Development Progress</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Countdown -->
    <div class="info-row">
      <div class="info-item">
        <span class="info-value" id="cd-days">00</span>
        <span class="info-label">Days</span>
      </div>
      <div class="info-item">
        <span class="info-value" id="cd-hours">00</span>
        <span class="info-label">Hours</span>
      </div>
      <div class="info-item">
        <span class="info-value" id="cd-min">00</span>
        <span class="info-label">Minutes</span>
      </div>
      <div class="info-item">
        <span class="info-value" id="cd-sec">00</span>
        <span class="info-label">Seconds</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Notify -->
    <div style="width:100%; display:flex; flex-direction:column; gap:0.75rem; align-items:center;">
      <form class="notify-form" id="notifyForm" onsubmit="handleSubmit(event)">
        <input type="email" id="emailInput" placeholder="Masukkan email kamu…" required />
        <button type="submit">Notify Me</button>
      </form>
      <span class="success-msg" id="successMsg">✓ Kamu akan diberitahu saat kami siap!</span>
    </div>

  </div>

  <footer>© 2026 · Under Construction</footer>

  <script>
    // ── Progress bar ──────────────────────────────────────────────
    const TARGET = 68; // ganti sesuai progress nyata (%)
    const fill   = document.getElementById('fill');
    const pct    = document.getElementById('pct');

    window.addEventListener('load', () => {
      setTimeout(() => {
        fill.style.width = TARGET + '%';
        let current = 0;
        const step = () => {
          if (current < TARGET) {
            current++;
            pct.textContent = current + '%';
            requestAnimationFrame(step);
          }
        };
        requestAnimationFrame(step);
      }, 400);
    });

    // ── Countdown ─────────────────────────────────────────────────
    const LAUNCH = new Date('2027-01-01T00:00:00');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now  = new Date();
      const diff = LAUNCH - now;
      if (diff <= 0) {
        document.getElementById('cd-days').textContent  = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-min').textContent   = '00';
        document.getElementById('cd-sec').textContent   = '00';
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000)  / 60000);
      const s = Math.floor((diff % 60000)    / 1000);
      document.getElementById('cd-days').textContent  = pad(d);
      document.getElementById('cd-hours').textContent = pad(h);
      document.getElementById('cd-min').textContent   = pad(m);
      document.getElementById('cd-sec').textContent   = pad(s);
    }

    tick();
    setInterval(tick, 1000);

    // ── Notify form ───────────────────────────────────────────────
    function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('notifyForm');
      const msg  = document.getElementById('successMsg');
      form.style.display    = 'none';
      msg.style.display     = 'block';
    }
  </script>
</body>
</html>
